[project]
name = "stemtutor"
version = "0.1.0"
description = "Learn to recreate tracks on mini MIDI controllers: track -> stems -> parts -> controller-aware tutorials."
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pretty_midi>=0.2.10",
  "mido>=1.3",
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "librosa>=0.10.2",
  "yt-dlp>=2025.1.1",
  # Spotify basic-pitch; runs through onnxruntime (TensorFlow is disabled below).
  "basic-pitch>=0.4.0",
  "onnxruntime>=1.18",
  "yt-dlp-ejs>=0.8.0",
]

[project.optional-dependencies]
# Optional built-in stem separation (Demucs + PyTorch, ~3 GB). Without it, import stems
# produced elsewhere (Ableton Live 12.3 Suite Stem Separation, UVR, Moises...).
separation = ["demucs>=4.1.0", "torch>=2.1"]

[project.scripts]
stemtutor = "stemtutor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "httpx2>=2.16.0",
]

[tool.uv]
environments = [
  "sys_platform == 'win32'",
  "sys_platform == 'linux'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# basic-pitch 0.4.0 hard-requires TensorFlow <= 2.15 on Windows/Linux, which has no
# Python 3.12 wheels. We only use its ONNX model, so these backends are never installed.
override-dependencies = [
  # resampy < 0.4.3 (pinned by basic-pitch) imports pkg_resources, gone from modern setuptools.
  "resampy>=0.4.3",
  "tensorflow ; sys_platform == 'never'",
  "tensorflow-macos ; sys_platform == 'never'",
  "tflite-runtime ; sys_platform == 'never'",
  "coremltools ; sys_platform == 'never'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stemtutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
